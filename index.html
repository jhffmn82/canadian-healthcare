<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canadian Healthcare</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --fg: #fff; --hot: #ff2a3a; --gold: #ffd23a; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: 'Press Start 2P', monospace; overflow: hidden; }
  #screen { position: absolute; inset: 0; margin: auto; aspect-ratio: 16 / 9; max-width: 100vw; max-height: 100vh; overflow: hidden; background: #000; }
  #still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; opacity: 0; transition: opacity .4s; }
  #still.on { opacity: 1; animation: pan 9s linear forwards; }
  @keyframes pan { from { transform: scale(1.02); } to { transform: scale(1.1) translate(-1%, -1%); } }
  #cap { position: absolute; left: 14%; right: 14%; bottom: 5%; padding: 1.6% 2.2%; background: rgba(0,0,0,.8); border: 3px solid var(--gold); font-size: clamp(9px, 1.9vmin, 18px); line-height: 1.7; min-height: 3.4em; display: none; }
  #card { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6% 12%; gap: 2.5em; font-size: clamp(10px, 2.2vmin, 20px); line-height: 1.8; }
  #card .fact { color: #aaa; font-size: .7em; max-width: 34em; }
  #coin { position: absolute; inset: 0; display: none; flex-direction: column; gap: 1.5em; align-items: center; justify-content: center; color: var(--hot); font-size: clamp(16px, 4vmin, 40px); }
  #coin span { animation: blink 1s steps(1) infinite; }
  #coin small { color: var(--fg); font-size: .4em; }
  @keyframes blink { 50% { opacity: 0; } }
  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2em; cursor: pointer; text-align: center; }
  #start h1 { color: var(--hot); font-size: clamp(16px, 4.5vmin, 46px); text-shadow: 4px 4px 0 var(--gold); margin: 0; }
  #start p { font-size: clamp(9px, 1.8vmin, 16px); animation: blink 1s steps(1) infinite; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: none; }
  #skip { position: absolute; top: 3%; right: 3%; font: inherit; font-size: clamp(8px, 1.4vmin, 13px); background: #000; color: #fff; border: 2px solid #fff; padding: .6em .8em; display: none; cursor: pointer; z-index: 5; }
  #pad { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; padding: 1.5%; pointer-events: none; z-index: 4; }
  #pad div { display: flex; gap: 6px; align-items: flex-end; }
  #pad button { pointer-events: auto; font: inherit; font-size: 9px; width: 4.4em; height: 4.4em; background: rgba(0,0,0,.55); color: #fff; border: 2px solid var(--gold); border-radius: 8px; touch-action: none; user-select: none; -webkit-user-select: none; }
  #screen::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 6; background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.16) 2px 4px); box-shadow: inset 0 0 10vmin rgba(0,0,0,.6); }
</style>
<div id="screen">
  <img id="still" alt="">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="cap"></div>
  <div id="card"><div id="tag"></div><div class="fact" id="fact"></div></div>
  <div id="coin"><span>INSERT COIN</span><small>PRESS START</small></div>
  <div id="start"><h1>CANADIAN<br>HEALTHCARE</h1><p>PRESS START</p></div>
  <button id="skip">SKIP INTRO</button>
  <div id="pad">
    <div><button data-k="L">&#9664;</button><div style="flex-direction:column"><button data-k="U">&#9650;</button><button data-k="D">&#9660;</button></div><button data-k="R">&#9654;</button></div>
    <div><button data-k="REF">REFER</button><button data-k="SCAN">SCAN</button><button data-k="FIRE">FIRE</button></div>
  </div>
</div>
<script>
const LINES = [
  'In a nation of FREE healthcare... the waitlist is ENDLESS!',
  'Eighteen months for a scan. Two years for a surgeon. But the government has a SOLUTION!',
  'Why treat... when you can CLOSE THE FILE?',
  'You are a TERMINAL CARE PROVIDER. Fresh out of the academy. Ready to SERVE.',
  'Your SCANNER detects cancer at fifty paces!',
  'And your ministry-issued sidearm... END OF LIFE CARE... provides the cure the system can afford!',
  "Hit your quota. Save the province money. Don't ask about the oncology referral. It was lost.",
];
const TAG = 'Inspired by the true story of Air Force veteran Kristin Logan.';
const FACT = 'Diagnosed with stage 4 ovarian cancer in British Columbia in 2023, she says information on Medical Assistance in Dying arrived in her mail before she had met an oncologist. She went to the United States for treatment.';
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
let skipped = false, curAudio = null, talkAudio = null;

// ---------- audio ----------
let ctx;
function voice(name) { const a = new Audio(`vo/${name}.mp3`); a.play().catch(() => {}); return a; }
const say = name => new Promise(r => { const a = curAudio = voice(name); a.onended = r; a.onerror = r; });
function talk(name) { if (talkAudio) talkAudio.pause(); talkAudio = voice(name); }
async function type(el, text, ms) { el.textContent = ''; for (const ch of text) { if (skipped) return; el.textContent += ch; await wait(ms); } }
function tone(f, d, type = 'square', v = 0.08, slide = 0) {
  const o = ctx.createOscillator(), gn = ctx.createGain(), t = ctx.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(gn).connect(ctx.destination); o.start(t); o.stop(t + d);
}
function bang() {
  const n = ctx.sampleRate * 0.5, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
  const s = ctx.createBufferSource(), gn = ctx.createGain(); gn.gain.value = 0.6;
  s.buffer = b; s.connect(gn).connect(ctx.destination); s.start();
  tone(120, 0.25, 'sine', 0.4, 40);
}

// ---------- intro ----------
$('start').onclick = async () => {
  ctx = new AudioContext();
  $('start').style.display = 'none';
  $('skip').style.display = 'block';
  playMusic('title', 0.3);
  const still = $('still'), cap = $('cap');
  cap.style.display = 'block';
  for (let i = 0; i < LINES.length; i++) {
    still.classList.remove('on'); await wait(400); if (skipped) return;
    still.src = `stills/still-${i + 1}.jpg`; void still.offsetWidth; still.classList.add('on');
    await Promise.all([say(`vo-${i + 1}`), type(cap, LINES[i], 38)]); if (skipped) return;
    await wait(700); if (skipped) return;
  }
  still.classList.remove('on'); cap.style.display = 'none';
  for (let v = 0.3; v > 0; v -= 0.03) { if (music) music.volume = Math.max(0, v); await wait(120); }
  await wait(1500); if (skipped) return;
  $('card').style.display = 'flex';
  $('tag').textContent = TAG; $('fact').textContent = FACT;
  await say('vo-8'); if (skipped) return;
  await wait(2500); if (skipped) return;
  $('card').style.display = 'none';
  $('coin').style.display = 'flex';
  $('skip').style.display = 'none';
  say('vo-9');
  await anyPress(); if (!skipped) startGame();
};
$('skip').onclick = () => { if (curAudio) curAudio.pause(); playMusic(null); startGame(); };

// ---------- input ----------
const keys = {}; let pressed = null;
const KEYMAP = { ArrowLeft: 'L', a: 'L', A: 'L', ArrowRight: 'R', d: 'R', D: 'R', ArrowUp: 'U', w: 'U', W: 'U', ArrowDown: 'D', s: 'D', S: 'D', ' ': 'SCAN', f: 'FIRE', F: 'FIRE', j: 'FIRE', Enter: 'FIRE', r: 'REF', R: 'REF', k: 'REF' };
function press() { if (pressed) { const p = pressed; pressed = null; p(); } }
function keyDown(k) { if (!keys[k] && mode === 'play') { if (k === 'FIRE') fire(); if (k === 'REF') refer(); } keys[k] = true; }
addEventListener('keydown', e => { const k = KEYMAP[e.key]; if (k) { keyDown(k); e.preventDefault(); } press(); });
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
const anyPress = () => new Promise(r => setTimeout(() => { pressed = r; }, 400));
$('screen').addEventListener('pointerdown', press);
document.querySelectorAll('#pad button').forEach(b => {
  b.addEventListener('pointerdown', e => { e.preventDefault(); keyDown(b.dataset.k); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => { keys[b.dataset.k] = false; });
});

// ---------- game data ----------
const VW = 960, VH = 540;
const cv = $('game'), g = cv.getContext('2d');
const img = src => { const i = new Image(); i.src = src; return i; };
const IMG = { 'still-3': img('stills/still-3.jpg'), 'still-7': img('stills/still-7.jpg'), atlas: img('art/atlas.png') };
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => 'c' + (a + i));
const MAPS = {
  street: { panels: ['bg-1', 'bg-2', 'bg-3'], order: [0, 1, 2, 0], top: 440, bot: 508, crowd: 60, cast: range(2, 17), music: 'street' },
  rink: { panels: ['rk-1', 'rk-2', 'rk-3'], order: [0, 1, 2], top: 352, bot: 505, music: 'hockey', hockey: true, goalL: 180, goalR: 4680, goalY: 420 },
  ski: { panels: ['sk-1', 'sk-2', 'sk-3'], order: [0, 1, 2, 0], top: 450, bot: 512, crowd: 55, cast: range(25, 32), music: 'ski' },
};
const PANELS = {}; for (const m of Object.values(MAPS)) for (const p of m.panels) PANELS[p] = img(`art/${p}.jpg`);
const PW = 1620;
let MAP = MAPS.street, WORLD = 0, TOP = 0, BOT = 0;
let A = null;   // atlas frames
const GEAR = ['c25', 'c26', 'c28', 'c32'];          // helmets and goggles hide symptoms
const MISSIONS = [
  { map: 'street', name: 'MAIN STREET', sick: 3, time: 90, brief: 'min-1', text: "Welcome to the team, Provider! Somewhere on this street, three citizens have cancer. Scan the crowd. Find them. Close their files. Remember: it's not a cost. It's compassion." },
  { map: 'street', name: 'RUSH HOUR', sick: 4, time: 80, crowd: 85, pace: 1.35, brief: 'brief-2', text: "Rush hour, Provider! Eighty-five commuters, four cases, and everyone's in a hurry. Just like the surgical waitlist. Oh, wait. That one never moves." },
  { map: 'rink', name: 'HOCKEY NIGHT', sick: 3, time: 75, brief: 'min-2', text: "Bad news, Provider. The budget is short again, so we're going where the people are: the big game! Three players on the ice have cancer. Only the sick ones. A healthy enforcer costs the league a fortune." },
  { map: 'rink', name: 'PLAYOFFS', sick: 4, time: 75, lines: 22, brief: 'brief-4', text: "Playoffs! The arena is packed and both coaches are rolling two lines. Four cases between them. Keep track of who you've scanned. Line changes wait for no one. Unlike patients." },
  { map: 'ski', name: 'APRES SKI', sick: 4, time: 85, gear: true, flee: 215, brief: 'min-3', text: 'Big day! Parliament is studying expanded eligibility, and the wealthy are hiding at the ski hill. Helmets and goggles slow your scanner. Healthy taxpayers fund your pension, Provider. Choose wisely.' },
  { map: 'ski', name: 'WHITEOUT', sick: 5, time: 85, gear: true, flee: 215, storm: true, brief: 'brief-6', text: 'A whiteout on the mountain, Provider! Your scanner range is cut in half, and five cases are hiding in the snow. Think of it as a blizzard of savings.' },
];
let music = null;
function playMusic(name, vol = 0.45) {
  if (music) music.pause();
  if (!name) { music = null; return; }
  music = new Audio(`music/${name}.mp3`); music.loop = true; music.volume = vol; music.play().catch(() => {});
}
const BARKS = ['I voted for this!', 'Thank you for the free healthcare!', "I'd rather be shot than pay for healthcare!", 'At least there was no co-pay!', 'Finally! Off the waitlist!', 'Sorry... sorry for the trouble, eh.', 'Tell my oncologist I said hi. If I ever get one.', 'Was that... covered?'];
const CLEARS = ["Hey, buddy, I'm fine!", "Do you mind? I'm walking here.", 'Is that thing even approved?', 'Ew, did you just scan me?'];
const REFS = ["Fourteen months? I'll take it!", 'Thank you! See you in 2028!', 'A real oncologist? Is this a dream?'];
const FLEES = ['No no no! I have a referral!', 'Nope! Not today!', 'Sorry! Sorry! But no!', "I'll pay cash! Just let me see a doctor!", 'Somebody call an oncologist!'];
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const font = px => `${px}px "Press Start 2P", monospace`;
let mode = 'off', S = null, MI = 0;
const TOT = { closed: 0, saved: 0, referred: 0 };

// ---------- mission flow ----------
async function startGame() {
  skipped = true;
  for (const id of ['start', 'still', 'cap', 'card', 'coin', 'skip']) $(id).style.display = 'none';
  cv.style.display = 'block';
  if (matchMedia('(pointer: coarse)').matches) $('pad').style.display = 'flex';
  if (!A) { A = await (await fetch('art/atlas.json')).json(); await document.fonts.load(font(8)); }
  MI = 0; TOT.closed = TOT.saved = TOT.referred = 0;
  if (mode === 'off') requestAnimationFrame(loop);
  brief();
}
async function brief() {
  S = { m: MISSIONS[MI], t0: performance.now() };
  mode = 'brief';
  const a = voice(S.m.brief); talkAudio = a;
  playMusic('title', 0.15);
  await anyPress();
  a.pause(); play();
}
function mkPerson(x, c) {
  return { c, x, y: TOP + Math.random() * (BOT - TOP), dir: Math.random() < 0.5 ? 1 : -1, sp: 40 + Math.random() * 35, state: 'walk', sick: false, scan: 0, scanned: false, t: Math.random() * 5, idle: 0, bubble: null, dt: 0 };
}
function play() {
  const m = MISSIONS[MI];
  MAP = MAPS[m.map]; WORLD = PW * MAP.order.length; TOP = MAP.top; BOT = MAP.bot;
  S = { m, t: m.time, found: 0, closed: 0, saved: 0, referred: 0, refs: 1, p: { x: MAP.hockey ? WORLD / 2 - 500 : 400, y: (TOP + BOT) / 2, dir: 1, walk: 0, gunT: 0 }, people: [], picks: [], floats: [], tracer: null, pickT: 8, scanT: null, flash: 0, fireCd: 0, hum: 0, clock: 0, lastDet: -9, score: [0, 0], hurry: false };
  if (MAP.hockey) setupHockey();
  else {
    const cast = MAP.cast.filter(c => A[c]);
    const n = m.crowd || MAP.crowd;
    for (let i = 0; i < n; i++) { const q = mkPerson(200 + (WORLD - 400) * (i + Math.random()) / n, pick(cast)); q.sp *= m.pace || 1; S.people.push(q); }
  }
  const far = S.people.filter(p => Math.abs(p.x - S.p.x) > (MAP.hockey ? 250 : 700) && p.role !== 'R').sort(() => Math.random() - 0.5);
  for (const p of far.slice(0, m.sick)) p.sick = true;
  mode = 'play';
  voice('ann-mission');
  playMusic(MAP.music, 0.4);
}
async function endMission(win, why) {
  mode = 'result'; playMusic('title', 0.2);
  S.win = win; S.why = why;
  if (why === 'wrong') {
    await new Promise(r => { const a = voice('ann-malpractice'); a.onended = r; a.onerror = r; });
    await new Promise(r => { const a = voice('min-wrong'); a.onended = r; a.onerror = r; });
  } else {
    await new Promise(r => { const a = voice(win ? 'ann-quota' : 'ann-time'); a.onended = r; a.onerror = r; });
    if (!win) voice('min-fail');
  }
  await anyPress();
  if (!win) { brief(); return; }
  TOT.closed += S.closed; TOT.saved += S.saved; TOT.referred += S.referred;
  if (++MI < MISSIONS.length) { brief(); return; }
  mode = 'end'; S = { t0: performance.now(), stage: 0 };
  const a = voice('min-win');
  a.onended = () => { S.stage = 1; S.t1 = performance.now(); const b = voice('vo-8'); b.onended = () => { voice('ann-gameover'); S.stage = 2; }; };
  while (S.stage < 2) await wait(200);
  await anyPress();
  startGame();
}

// ---------- play logic ----------
const alive = p => p.state === 'walk' || p.state === 'idle' || p.state === 'run';
function target(pred, range) {
  const P = S.p; let best = null, bd = 1e9;
  for (const p of S.people) {
    if (!pred(p)) continue;
    const dx = (p.x - P.x) * P.dir;
    if (dx < 10 || dx > range || Math.abs(p.y - P.y) > 34) continue;
    if (dx < bd) { bd = dx; best = p; }
  }
  return best;
}
const float = (text, x, y, color = '#fff') => S.floats.push({ text, x, y, color, t: 0 });
function fire() {
  if (S.fireCd > 0) return;
  S.fireCd = 0.4;
  const P = S.p;
  P.gunT = 0.35;
  bang(); S.flash = 0.06;
  const q = target(alive, 360);
  S.tracer = { x0: P.x + P.dir * 70, y0: P.y - 92, x1: q ? q.x : P.x + P.dir * 480, y1: q ? q.y - 80 : P.y - 92, t: 0.07 };
  if (!q) return;
  q.state = 'dead'; q.dt = 0;
  if (!q.sick) {
    q.bubble = null;
    float('HEALTHY TAXPAYER!', q.x, q.y - 160, '#ff4a5a');
    endMission(false, 'wrong');
    return;
  }
  S.closed++; S.found += q.detected ? 0 : 1;
  const amt = Math.round(40 + Math.random() * 80) * 1000; S.saved += amt;
  float('FILE CLOSED', q.x, q.y - 172, '#ffd23a');
  float('+' + money(amt) + ' SAVED', q.x, q.y - 150, '#7aff9a');
  const b = Math.random() * BARKS.length | 0;
  q.bubble = { text: BARKS[b], t: 3.2 };
  setTimeout(() => talk(`bark-${b + 1}`), 250);
}
function refer() {
  const P = S.p, q = target(p => p.state === 'run', 140);
  if (!q) return;
  if (S.refs <= 0) { float('NO REFERRAL FORMS', P.x, P.y - 160, '#ff4a5a'); tone(200, 0.15); return; }
  S.refs--; S.referred++;
  q.state = 'referred'; q.sp = 30; q.dir = Math.random() < 0.5 ? 1 : -1;
  const i = Math.random() * REFS.length | 0;
  q.bubble = { text: REFS[i], t: 3 }; talk(`ref-${i + 1}`);
  float('REFERRAL FILED', q.x, q.y - 172, '#7ae0ff');
  float('WAIT: 14 MONTHS', q.x, q.y - 150, '#fff');
  tone(660, 0.1); setTimeout(() => tone(990, 0.15), 100);
}
function detect(q) {
  q.detected = true; q.state = 'run'; q.sp = (S.m.flee || 150) + Math.random() * 30; q.dir = q.x > S.p.x ? 1 : -1; S.found++;
  tone(880, 0.12); setTimeout(() => tone(440, 0.3), 120);
  float('MALIGNANCY DETECTED', q.x, q.y - 160, '#ff4a5a');
  const i = Math.random() * FLEES.length | 0;
  q.bubble = { text: FLEES[i], t: 2.6 }; talk(`flee-${i + 1}`);
  if (S.clock - S.lastDet > 4) { S.lastDet = S.clock; setTimeout(() => voice('ann-detected'), 1400); }
}
function update(dt) {
  const P = S.p;
  S.t -= dt; S.clock += dt; S.fireCd -= dt; P.gunT -= dt; S.flash -= dt;
  if (S.tracer && (S.tracer.t -= dt) <= 0) S.tracer = null;
  const mx = (keys.R ? 1 : 0) - (keys.L ? 1 : 0), my = (keys.D ? 1 : 0) - (keys.U ? 1 : 0);
  if (mx) P.dir = mx;
  if (mx || my) P.walk += dt;
  P.x = clamp(P.x + mx * 240 * dt, 40, WORLD - 40);
  P.y = clamp(P.y + my * 120 * dt, TOP, BOT);

  S.scanT = null;
  if (keys.SCAN) {
    const q = target(p => (p.state === 'walk' || p.state === 'idle') && !p.scanned, S.m.storm ? 150 : 280);
    if (q) {
      S.scanT = q; q.scan += dt / (S.m.gear && GEAR.includes(q.c) ? 1.3 : 0.6);
      S.hum -= dt; if (S.hum <= 0) { S.hum = 0.1; tone(500 + q.scan * 700, 0.07, 'sine', 0.04); }
      if (q.scan >= 1) {
        q.scanned = true;
        if (q.sick) detect(q);
        else {
          tone(660, 0.08, 'triangle'); setTimeout(() => tone(1320, 0.12, 'triangle'), 80);
          if (Math.random() < 0.35) { const i = Math.random() * CLEARS.length | 0; q.bubble = { text: CLEARS[i], t: 2.5 }; talk(`clear-${i + 1}`); }
        }
      }
    }
  }
  for (const p of S.people) {
    p.t += dt;
    if (p.bubble && (p.bubble.t -= dt) <= 0) p.bubble = null;
    if (p.state === 'dead') { p.dt += dt; continue; }
    if (S.scanT === p || p.state === 'bench') continue;
    if (p.team !== undefined && p.state === 'walk') continue;
    if (p.state === 'walk' && Math.random() < dt * 0.08) { p.state = 'idle'; p.idle = 1 + Math.random() * 3; }
    if (p.state === 'idle') { if ((p.idle -= dt) <= 0) { p.state = 'walk'; if (Math.random() < 0.4) p.dir *= -1; } continue; }
    if (p.state === 'run' && Math.random() < dt * 0.6) p.y = clamp(p.y + (Math.random() - 0.5) * 40, TOP, BOT);
    p.x += p.dir * p.sp * dt;
    if (p.x < 30 || p.x > WORLD - 30) { p.dir *= -1; p.x = clamp(p.x, 30, WORLD - 30); }
  }
  S.people = S.people.filter(p => p.state !== 'dead' || p.dt < 10);
  if (MAP.hockey) updateHockey(dt);
  if (!S.hurry && S.t < 30) { S.hurry = true; voice('ann-hurry'); }

  if ((S.pickT -= dt) <= 0) { S.pickT = 10 + Math.random() * 8; S.picks.push({ x: clamp(P.x + (Math.random() < 0.5 ? -1 : 1) * (200 + Math.random() * 300), 60, WORLD - 60), y: TOP + Math.random() * (BOT - TOP) }); }
  S.picks = S.picks.filter(k => {
    if (Math.abs(k.x - P.x) < 30 && Math.abs(k.y - P.y) < 24 && S.refs < 3) { S.refs++; tone(990, 0.08, 'triangle'); setTimeout(() => tone(1480, 0.1, 'triangle'), 70); float('+1 REFERRAL FORM', k.x, k.y - 90, '#7ae0ff'); return false; }
    return true;
  });
  for (const f of S.floats) f.t += dt;
  S.floats = S.floats.filter(f => f.t < 1.8);
  if (S.closed + S.referred >= S.m.sick) endMission(true);
  else if (S.t <= 0) endMission(false, 'time');
}

// ---------- hockey ----------
function setupHockey() {
  const mid = WORLD / 2, line = [
    ['c18', 0, 'F'], ['c18', 0, 'F'], ['c19', 0, 'D'], ['c19', 0, 'D'], ['c18', 0, 'C'],
    ['c20', 1, 'F'], ['c20', 1, 'F'], ['c21', 1, 'D'], ['c21', 1, 'D'], ['c20', 1, 'C']];
  const roster = [...line.map(r => [...r, 0]), ...(S.m.lines ? line.map(r => [...r, 1]) : []), ['c22', 0, 'G', 0], ['c23', 1, 'G', 0], ['c24', -1, 'R', 0]];
  roster.forEach(([c, team, role, ln], i) => {
    const p = mkPerson(mid + (team === 0 ? -1 : 1) * (120 + (i % 5) * 110), c);
    Object.assign(p, { team, role, line: ln, slot: i % 6, sp: 0, vx: 0, vy: 0 });
    if (role === 'G') p.x = team === 0 ? MAP.goalL + 70 : MAP.goalR - 70;
    if (ln) p.state = 'bench';
    S.people.push(p);
  });
  S.lineT = S.m.lines || 0;
  S.puck = { x: mid, y: (TOP + BOT) / 2, vx: 0, vy: 0, owner: null, free: 1.5 };
}
const skater = p => p.team !== undefined && p.team >= 0 && p.role !== 'G' && p.state === 'walk';
function goal(team) {
  const pk = S.puck;
  S.score[team]++;
  voice('ann-goal'); tone(233, 1.4, 'sawtooth', 0.12); tone(294, 1.4, 'sawtooth', 0.1);
  float(`GOAL! ${team === 0 ? 'RED' : 'BLUE'} SCORES`, pk.x, (TOP + BOT) / 2 - 80, team === 0 ? '#ff5a5a' : '#6ab0ff');
  Object.assign(pk, { x: WORLD / 2, y: (TOP + BOT) / 2, vx: 0, vy: 0, owner: null, free: S.clock + 2 });
}
function shoot(p, tx) {
  const pk = S.puck, ty = MAP.goalY + (Math.random() - 0.5) * 70, d = Math.hypot(tx - pk.x, ty - pk.y) || 1;
  pk.owner = null; pk.vx = (tx - pk.x) / d * 700; pk.vy = (ty - pk.y) / d * 700; pk.free = S.clock + 0.35;
  tone(160, 0.07, 'square', 0.2);
}
function lineChange() {
  for (const p of S.people) {
    if (p.line === undefined || p.role === 'G' || p.role === 'R') continue;
    if (p.state === 'walk') { p.state = 'bench'; if (S.puck.owner === p) S.puck.owner = null; }
    else if (p.state === 'bench') { p.state = 'walk'; p.x = clamp(S.puck.x + (Math.random() - 0.5) * 500, 300, WORLD - 300); p.y = TOP + 4; p.vx = p.vy = 0; p.scanned = false; p.scan = 0; }
  }
  float('LINE CHANGE!', S.puck.x, TOP - 40, '#ffd23a'); voice('ann-line'); tone(1800, 0.5, 'square', 0.06);
}
function updateHockey(dt) {
  const M = MAP, pk = S.puck;
  if (S.lineT && (S.lineT -= dt) <= 0) { S.lineT = S.m.lines; lineChange(); }
  if (pk.owner && pk.owner.state !== 'walk') pk.owner = null;
  if (pk.owner) { pk.x = pk.owner.x + pk.owner.dir * 34; pk.y = pk.owner.y - 2; }
  else {
    pk.x += pk.vx * dt; pk.y += pk.vy * dt;
    const f = Math.pow(0.45, dt); pk.vx *= f; pk.vy *= f;
    if (pk.y < TOP) { pk.y = TOP; pk.vy = Math.abs(pk.vy); }
    if (pk.y > BOT) { pk.y = BOT; pk.vy = -Math.abs(pk.vy); }
    const inMouth = Math.abs(pk.y - M.goalY) < 36;
    if (pk.x < M.goalL && inMouth) goal(1);
    else if (pk.x > M.goalR && inMouth) goal(0);
    else if (pk.x < M.goalL - 90 || pk.x > M.goalR + 90) { pk.vx = -pk.vx * 0.6; pk.x = clamp(pk.x, M.goalL - 90, M.goalR + 90); }
  }
  const chaser = [0, 1].map(t => S.people.filter(p => skater(p) && p.team === t).sort((a, b) => Math.hypot(a.x - pk.x, a.y - pk.y) - Math.hypot(b.x - pk.x, b.y - pk.y))[0]);
  for (const p of S.people) {
    if (p.team === undefined || p.state !== 'walk') continue;
    if (S.scanT === p) { p.vx = p.vy = p.sp = 0; continue; }
    const att = p.team === 0 ? 1 : -1;
    let tx, ty, speed;
    if (p.role === 'G') { tx = p.team === 0 ? M.goalL + 70 : M.goalR - 70; ty = clamp(pk.y, M.goalY - 45, M.goalY + 45); speed = 90; }
    else if (p.role === 'R') { tx = pk.x - 280; ty = TOP + 6; speed = 150; }
    else if (pk.owner === p) {
      tx = p.team === 0 ? M.goalR : M.goalL; ty = M.goalY + Math.sin(S.clock * 2 + p.slot) * 50; speed = 150;
      if (Math.abs(p.x - tx) < 560 && Math.random() < dt * 1.3) shoot(p, tx);
    }
    else if (chaser[p.team] === p) { tx = pk.x; ty = pk.y; speed = 180; }
    else { tx = pk.x + att * { F: 160, C: 40, D: -240 }[p.role] + (p.slot % 2 ? 70 : -70); ty = TOP + (BOT - TOP) * (0.12 + 0.76 * ((p.slot * 0.37 + p.team * 0.21) % 1)); speed = 130; }
    for (const o of S.people) {                 // keep skaters from piling into one scrum
      if (o === p || o.team === undefined || o.state !== 'walk' || pk.owner === p) continue;
      const ox = p.x - o.x, oy = (p.y - o.y) * 2, od = Math.hypot(ox, oy);
      if (od < 90 && od > 0) { tx += ox / od * (90 - od) * 2; ty += oy / od * (90 - od); }
    }
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy) || 1, want = Math.min(speed, d * 2), k = Math.min(1, dt * 3);
    p.vx += (dx / d * want - p.vx) * k; p.vy += (dy / d * want - p.vy) * k;
    p.x = clamp(p.x + p.vx * dt, 40, WORLD - 40); p.y = clamp(p.y + p.vy * dt, TOP, BOT);
    p.sp = Math.hypot(p.vx, p.vy); if (Math.abs(p.vx) > 15) p.dir = Math.sign(p.vx);
    if (!skater(p)) {
      if (p.role === 'G' && !pk.owner && Math.hypot(pk.x - p.x, pk.y - p.y) < 46 && Math.abs(pk.vx) > 120 && Math.random() < 0.7) { pk.vx = -pk.vx * 0.4; pk.vy = (Math.random() - 0.5) * 320; tone(320, 0.05); }
      continue;
    }
    if (!pk.owner && S.clock > pk.free && Math.hypot(pk.x - (p.x + p.dir * 30), pk.y - p.y) < 30) pk.owner = p;
    else if (pk.owner && pk.owner.team !== p.team && Math.hypot(pk.owner.x - p.x, pk.owner.y - p.y) < 34 && Math.random() < dt * 1.6) pk.owner = p;
  }
}

// ---------- drawing ----------
function spr(fr, x, y, flip) {
  const [sx, sy, w, h, ax, ay] = fr;
  if (flip) { g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(-1, 1); g.drawImage(IMG.atlas, sx, sy, w, h, -ax, -ay, w, h); g.restore(); }
  else g.drawImage(IMG.atlas, sx, sy, w, h, Math.round(x - ax), Math.round(y - ay), w, h);
}
function personFrame(p) {
  const a = A[p.c];
  if (p.state === 'dead') return a.dead[0];
  if (p.state === 'idle' || S.scanT === p) return a.walk[0];
  if (p.state === 'run') { const r = a.run || a.walk; return r[Math.floor(p.t * (a.run ? 9 : 12)) % r.length]; }
  return a.walk[Math.floor(p.t * p.sp / 22) % 4];
}
function playerFrame() {
  const a = A.c1, P = S.p;
  if (P.gunT > 0) return a.aim[0];
  if (keys.SCAN) return a.scan[0];
  if (keys.L || keys.R || keys.U || keys.D) return a.walk[Math.floor(P.walk * 9) % 4];
  return a.idle[0];
}
function wrapLines(text, maxW) {
  const lines = []; let line = '';

  if (line) lines.push(line);
  return lines;
}
function bubble(text, sx, sy) {
  g.font = font(10); g.textAlign = 'left'; g.textBaseline = 'top';
  const lines = wrapLines(text, 240);
  const bw = Math.max(...lines.map(l => g.measureText(l).width)) + 20, bh = lines.length * 16 + 14;
  const bx = clamp(sx - bw / 2, 6, VW - 6 - bw), by = sy - bh - 12;
  g.fillStyle = '#000'; g.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
  g.fillStyle = '#fff'; g.fillRect(bx, by, bw, bh); g.fillRect(sx - 5, by + bh, 10, 9);
  g.fillStyle = '#000'; lines.forEach((l, i) => g.fillText(l, bx + 10, by + 9 + i * 16));
}
function drawPlay() {
  const P = S.p, cam = clamp(P.x - VW * 0.45, 0, WORLD - VW);
  g.imageSmoothingEnabled = false;
  const first = Math.floor(cam / PW);
  for (let i = first; i <= first + 1 && i < MAP.order.length; i++) g.drawImage(PANELS[MAP.panels[MAP.order[i]]], Math.round(i * PW - cam), 0, PW, VH);
  g.save(); g.translate(-Math.round(cam), 0);
  for (const k of S.picks) {
    const y = k.y - 14 + Math.sin(S.clock * 4 + k.x) * 3;
    g.fillStyle = '#000'; g.fillRect(k.x - 15, y - 12, 30, 24);
    g.fillStyle = '#e8c070'; g.fillRect(k.x - 13, y - 10, 26, 20); g.fillRect(k.x - 13, y - 14, 10, 4);
    g.fillStyle = '#c0392b'; g.fillRect(k.x - 2, y - 6, 4, 12); g.fillRect(k.x - 6, y - 2, 12, 4);
  }
  const ents = [...S.people.filter(p => p.state !== 'bench' && p.x > cam - 200 && p.x < cam + VW + 200), P, ...(S.puck ? [S.puck] : [])].sort((a, b) => a.y - b.y);
  const blink = Math.floor(performance.now() / 250) % 2;
  for (const e of ents) {
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(e.x, e.y, 30, 7, 0, 0, 7); g.fill();
    if (e === P) { spr(playerFrame(), P.x, P.y, P.dir < 0); continue; }
    if (e === S.puck) { g.fillStyle = '#111'; g.beginPath(); g.ellipse(e.x, e.y, 9, 4, 0, 0, 7); g.fill(); continue; }
    if (e.state === 'dead') {
      g.globalAlpha = clamp(10 - e.dt, 0, 1);
      if (e.dt < 0.18) { g.save(); g.translate(e.x, e.y); g.rotate(-e.dir * e.dt * 6); spr(A[e.c].walk[0], 0, 0, e.dir < 0); g.restore(); }
      else spr(A[e.c].dead[0], e.x, e.y, e.dir < 0);
      g.globalAlpha = 1; continue;
    }
    if (e.state === 'run') { g.fillStyle = blink ? 'rgba(255,40,60,.55)' : 'rgba(255,40,60,.25)'; g.beginPath(); g.ellipse(e.x, e.y, 36, 9, 0, 0, 7); g.fill(); }
    spr(personFrame(e), e.x, e.y, e.dir < 0);
    const top = e.y - 150;
    if (e.state === 'run' && blink) { g.fillStyle = '#ff2a3a'; g.fillRect(e.x - 4, top - 24, 8, 18); g.fillRect(e.x - 4, top - 2, 8, 6); }
    if (e.scanned && !e.sick) { g.strokeStyle = '#3f6'; g.lineWidth = 4; g.beginPath(); g.moveTo(e.x - 8, top - 6); g.lineTo(e.x - 2, top); g.lineTo(e.x + 9, top - 14); g.stroke(); }
    if (e.state === 'referred') { g.fillStyle = '#000'; g.fillRect(e.x - 34, top - 26, 68, 22); g.fillStyle = '#fff'; g.fillRect(e.x - 32, top - 24, 64, 18); g.fillStyle = '#000'; g.font = font(9); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('14 MO', e.x, top - 14); }
  }
  const q = S.scanT;
  if (q) {
    const hx = P.x + P.dir * 52, hy = P.y - 92, red = q.sick && q.scan > 0.6;
    g.fillStyle = red ? 'rgba(255,60,60,.25)' : 'rgba(80,255,140,.22)';
    g.beginPath(); g.moveTo(hx, hy); g.lineTo(q.x, q.y - 140); g.lineTo(q.x, q.y); g.fill();
    g.fillStyle = '#000'; g.fillRect(q.x - 30, q.y - 166, 60, 10);
    g.fillStyle = red ? '#f33' : '#3f6'; g.fillRect(q.x - 28, q.y - 164, 56 * Math.min(1, q.scan), 6);
  }
  if (S.tracer) {
    const t = S.tracer;
    g.strokeStyle = '#fff6b0'; g.lineWidth = 3; g.beginPath(); g.moveTo(t.x0, t.y0); g.lineTo(t.x1, t.y1); g.stroke();
    g.fillStyle = '#fff6b0'; g.beginPath(); g.arc(t.x0, t.y0, 14, 0, 7); g.fill();
    g.fillStyle = '#ff9a2a'; g.beginPath(); g.arc(t.x0, t.y0, 8, 0, 7); g.fill();
  }
  g.restore();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const f of S.floats) {
    g.globalAlpha = clamp(1.8 - f.t, 0, 1); g.font = font(12);
    const fx = clamp(f.x - cam, 160, VW - 160), fy = f.y - 80 - f.t * 30, fw = g.measureText(f.text).width + 16;
    g.fillStyle = 'rgba(0,0,0,.85)'; g.fillRect(fx - fw / 2, fy - 13, fw, 26);
    g.fillStyle = f.color; g.fillText(f.text, fx, fy + 1);
  }
  g.globalAlpha = 1;
  for (const p of S.people) if (p.bubble && p.x > cam - 100 && p.x < cam + VW + 100) bubble(p.bubble.text, p.x - cam, p.y - 160);
  if (S.m.storm) {
    const px = P.x - cam, py = P.y - 70, fog = g.createRadialGradient(px, py, 90, px, py, 360);
    fog.addColorStop(0, 'rgba(235,240,250,0)'); fog.addColorStop(1, 'rgba(235,240,250,.93)');
    g.fillStyle = fog; g.fillRect(0, 0, VW, VH);
    g.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 160; i++) { const sx = (i * 97.3 + S.clock * (60 + i % 7 * 25)) % VW, sy = (i * 53.7 + S.clock * (140 + i % 5 * 30)) % VH; g.fillRect(sx, sy, 2 + i % 3, 2 + i % 3); }
  }
  if (S.flash > 0) { g.fillStyle = 'rgba(255,255,220,.35)'; g.fillRect(0, 0, VW, VH); }
  // HUD
  g.fillStyle = 'rgba(0,0,0,.85)'; g.fillRect(0, 0, VW, 54);
  g.font = font(12); g.textBaseline = 'top';
  g.fillStyle = '#ff2a3a'; g.textAlign = 'left'; g.fillText(`M${MI + 1} ${S.m.name}`, 16, 10);
  g.fillStyle = '#ffd23a'; g.textAlign = 'right'; g.fillText(`FILES ${S.closed + S.referred}/${S.m.sick}`, VW - 16, 10);
  const secs = Math.ceil(Math.max(0, S.t));
  g.fillStyle = 'rgba(0,0,0,.9)'; g.fillRect(VW / 2 - 92, 0, 184, 74); g.strokeStyle = S.t < 30 ? '#ff2a3a' : '#ffd23a'; g.lineWidth = 3; g.strokeRect(VW / 2 - 92, 1, 184, 72);
  g.font = font(28); g.textAlign = 'center'; g.fillStyle = S.t < 30 && Math.floor(performance.now() / 300) % 2 ? '#ff2a3a' : '#fff';
  g.fillText(`${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`, VW / 2, 14);
  g.font = font(9); g.fillStyle = '#aaa'; g.fillText(MAP.hockey ? `RED ${S.score[0]}  -  ${S.score[1]} BLUE` : `SCANNED ${S.people.filter(p => p.scanned).length}/${S.people.length}`, VW / 2, 54);
  g.textAlign = 'left'; g.fillStyle = '#7aff9a'; g.fillText(`PROVINCE SAVED ${money(S.saved)}`, 16, 34);
  g.textAlign = 'right'; g.fillStyle = '#7ae0ff'; g.fillText(`REFERRAL FORMS ${S.refs}`, VW - 16, 34);
  // radar
  const ry = VH - 14;
  g.fillStyle = 'rgba(0,0,0,.75)'; g.fillRect(0, ry - 4, VW, 18);
  g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(cam / WORLD * VW, ry - 2, VW / WORLD * VW, 14);
  for (const p of S.people) {
    if (p.state === 'run') { if (blink) { g.fillStyle = '#ff2a3a'; g.fillRect(p.x / WORLD * VW - 3, ry - 1, 6, 12); } }
    else if (p.state !== 'dead' && p.state !== 'bench') { g.fillStyle = p.scanned ? '#3f6' : '#888'; g.fillRect(p.x / WORLD * VW - 1, ry + 3, 2, 4); }
  }
  g.fillStyle = '#1abc9c'; g.fillRect(P.x / WORLD * VW - 3, ry - 3, 6, 16);
  if (MI === 0 && S.clock < 12) {
    g.textAlign = 'center'; g.font = font(10); g.fillStyle = 'rgba(0,0,0,.85)'; g.fillRect(150, VH - 60, 660, 30);
    g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText('ARROWS MOVE   SPACE SCAN   F FIRE   R REFER', VW / 2, VH - 44);
  }
}
function cover(im, alpha = 1) {
  g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH);

}
function box(y, h) {

  g.strokeStyle = '#ffd23a'; g.lineWidth = 3; g.strokeRect(100, y, VW - 200, h);
}
const blinkSlow = () => Math.floor(performance.now() / 500) % 2;
function drawBrief() {
  cover(IMG['still-3']);
  const m = S.m, n = Math.floor((performance.now() - S.t0) / 45);
  g.textAlign = 'left'; g.textBaseline = 'top';
  g.fillStyle = 'rgba(0,0,0,.85)'; g.fillRect(0, 0, VW, 52);
  g.font = font(14); g.fillStyle = '#ff2a3a'; g.fillText(`MISSION ${MI + 1}: ${m.name}`, 24, 10);
  g.font = font(10); g.fillStyle = '#ffd23a'; g.fillText(`CASES HIDING HERE: ${m.sick}   TIME: ${m.time}s   SHOOT ONLY THE SICK`, 24, 33);
  box(340, 168);
  g.font = font(11); g.fillStyle = '#fff';
  wrapLines(m.text.slice(0, n), VW - 260).forEach((l, i) => g.fillText(l, 124, 358 + i * 21));
  if (blinkSlow()) { g.fillStyle = '#ff2a3a'; g.font = font(10); g.textAlign = 'right'; g.fillText('PRESS START', VW - 120, 484); }
}
function drawResult() {
  cover(IMG['still-7'], 0.35);
  g.textAlign = 'center'; g.textBaseline = 'top';
  const wrong = S.why === 'wrong';
  g.font = font(26); g.fillStyle = S.win ? '#ffd23a' : '#ff2a3a'; g.fillText(S.win ? 'ALL FILES CLOSED!' : wrong ? 'MALPRACTICE!' : 'TIME UP!', VW / 2, 80);
  g.font = font(12); g.fillStyle = '#fff';
  if (wrong) { g.fillText('YOU SHOT A HEALTHY TAXPAYER.', VW / 2, 160); g.fillStyle = '#aaa'; g.fillText('THE PROVINCE LOSES THEIR TAX REVENUE.', VW / 2, 190); }
  g.fillStyle = '#fff'; g.fillText(`CASES FOUND: ${S.found}/${S.m.sick}`, VW / 2, 240);
  g.fillStyle = '#7aff9a'; g.fillText(`PROVINCE SAVED: ${money(S.saved)}`, VW / 2, 272);
  g.fillStyle = '#7ae0ff'; g.fillText(`REFERRED FOR TREATMENT: ${S.referred}`, VW / 2, 304);
  g.font = font(10); g.fillStyle = '#aaa';
  g.fillText(S.win ? (MI + 1 < MISSIONS.length ? 'THE MINISTER IS PLEASED.' : 'FINAL SHIFT COMPLETE.') : 'THE MINISTER IS DISAPPOINTED. TRY AGAIN.', VW / 2, 360);

}
function drawEnd() {
  if (S.stage === 0) {
    cover(IMG['still-3']);
    box(390, 80); g.font = font(11); g.fillStyle = '#fff'; g.textAlign = 'left'; g.textBaseline = 'top';
    wrapLines('Outstanding work. The province thanks you. Your bonus is a commemorative pin.', VW - 260).forEach((l, i) => g.fillText(l, 124, 408 + i * 21));
    return;
  }
  g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH);
  g.textAlign = 'center'; g.textBaseline = 'top';
  g.font = font(18); g.fillStyle = '#ffd23a'; g.fillText('SHIFT COMPLETE', VW / 2, 40);
  g.font = font(11);
  g.fillStyle = '#fff'; g.fillText(`FILES CLOSED: ${TOT.closed}`, VW / 2, 96);
  g.fillStyle = '#7aff9a'; g.fillText(`PROVINCE SAVED: ${money(TOT.saved)}`, VW / 2, 122);
  g.fillStyle = '#7ae0ff'; g.fillText(`YOU REFERRED FOR TREATMENT: ${TOT.referred}`, VW / 2, 148);
  g.fillStyle = '#ff2a3a'; g.fillText('THE SYSTEM REFERRED: 0', VW / 2, 174);
  g.font = font(11); g.fillStyle = '#fff'; wrapLines(TAG, 700).forEach((l, i) => g.fillText(l, VW / 2, 240 + i * 22));
  g.font = font(9); g.fillStyle = '#aaa'; wrapLines(FACT, 720).forEach((l, i) => g.fillText(l, VW / 2, 300 + i * 18));
  if (S.stage === 2 && blinkSlow()) { g.font = font(11); g.fillStyle = '#ff2a3a'; g.fillText('GAME OVER - PRESS START', VW / 2, 460); }
}
let last = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (mode === 'play') update(dt);
  if (mode === 'brief') drawBrief();
  else if (mode === 'play') drawPlay();
  else if (mode === 'result') drawResult();
  else if (mode === 'end') drawEnd();
  requestAnimationFrame(loop);
}
